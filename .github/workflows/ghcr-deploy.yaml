# Fork-only: build the deployed image (upstream + local fixes) to GHCR.
name: Build deploy image

on:
  push:
    branches: [deploy]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/audiobookrequest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: vars
        run: |
          UPSTREAM=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
          echo "version=${UPSTREAM}-fork.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
